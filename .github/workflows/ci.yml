# Intégration continue AWFORM — AUCUN secret.
# Build, typage, lint, tests unitaires et budget de poids, sur chaque envoi et chaque demande de fusion.
# Les tests qui ont besoin du contenu des livres (~/awform-content, hors dépôt) ou de PostgreSQL
# se désactivent seuls quand ce contenu est absent ; ils tournent sur la VM de développement.
# Les tests de bout en bout (Playwright) ont besoin du contenu et d'une base : désactivés ici (voir JOURNAL_DEV).
name: CI

on:
  push:
    # chaque lot et les corrections d'audit sont vérifiés par GitHub (décision du chef de projet)
    branches: [main, 'lot*-wip', 'corrections-audit', 'suite-v1', 'suite-v1-b']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm (corepack, version du package.json)
        run: corepack enable && pnpm --version
      - name: Installation (lockfile gelé)
        run: pnpm install --frozen-lockfile
      - name: Dépendances sans vulnérabilité connue (niveau « high » bloquant, audit INF-4)
        run: pnpm audit --audit-level high
      - name: Construction
        run: pnpm build
      - name: Typage
        run: pnpm typecheck
      - name: Lint et format
        run: pnpm lint
      - name: Tests unitaires (tous les paquets, même après un échec)
        run: pnpm -r --no-bail --workspace-concurrency=1 test
      - name: Budget de poids de l'application
        run: pnpm --filter @awform/web budget
      - name: Aucune normalisation Unicode ni secret dans le dépôt
        # audit QUA-1 : échec explicite, et lancé même si une étape précédente (budget de poids) a échoué
        if: ${{ !cancelled() }}
        run: bash infra/ci/garde-fous.sh

  images:
    # images de production construites (jamais publiées) et fichiers d'exploitation vérifiés
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scripts d'exploitation (syntaxe)
        run: for f in infra/prod/*.sh infra/*.sh infra/android/*.sh infra/relais/*.sh infra/securite/*.sh infra/git-hooks/*; do bash -n "$f"; done
      - name: Scripts d'exploitation (shellcheck, avertissements bloquants — audit INF-11)
        run: shellcheck --severity=warning infra/prod/*.sh infra/*.sh infra/android/*.sh infra/relais/*.sh infra/ci/*.sh infra/securite/*.sh infra/git-hooks/*
      - name: Docker Compose (configuration)
        run: |
          mkdir -p /tmp/awform-env && touch /tmp/awform-env/{api,worker,outils,db,caddy}.env
          AWFORM_ENV_DIR=/tmp/awform-env docker compose -f infra/prod/compose.yml config -q
          # relais d'école (lot 17)
          mkdir -p /tmp/awform-relais && touch /tmp/awform-relais/{relais,caddy}.env
          AWFORM_RELAIS_CONF=/tmp/awform-relais docker compose -f infra/relais/compose.yml config -q
      - name: Caddyfile (validation)
        run: |
          docker run --rm -e SITE=192.0.2.10 -e RELAIS_DOMAINE=relais.example.org -v "$PWD/infra/prod/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e SITE=app.example.org -e AWFORM_HTTP=rediriger -v "$PWD/infra/prod/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e RELAIS_HOST=ecole-1.relais.example.org -v "$PWD/infra/relais/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy adapt --config /etc/caddy/Caddyfile
      - name: Images api, worker, web
        run: |
          mkdir -p /tmp/awform-env && touch /tmp/awform-env/{api,worker,outils,db,caddy}.env
          AWFORM_ENV_DIR=/tmp/awform-env docker compose -f infra/prod/compose.yml build api worker web
          docker build -f infra/prod/Dockerfile --target relay -t awform/relay:ci -t awform/relay:local .
      - name: Sauvegarde puis restauration complète (instance jetable, mêmes lignes table par table)
        run: bash infra/ci/test-restauration.sh
      - name: Relais d'école de bout en bout (coupure du réseau et du courant, ni perte ni doublon)
        run: bash infra/ci/test-relais.sh

  base-et-tuteur:
    # tests sur PostgreSQL 18 (service conteneur, base jetable) et batterie adverse du tuteur (fournisseur
    # SIMULÉ, aucune clé) ; contenu : uniquement le texte et les métadonnées Tanzil (infra/ci/contenu),
    # jamais les livres — les tests qui en ont besoin se désactivent seuls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: awform
          POSTGRES_PASSWORD: awform-ci-jetable
          POSTGRES_DB: awform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awform -d awform_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://awform:awform-ci-jetable@localhost:5432/awform_test
      AWFORM_CONTENT_DIR: ${{ github.workspace }}/infra/ci/contenu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pnpm (corepack)
        run: corepack enable && pnpm --version
      - name: Installation (lockfile gelé)
        run: pnpm install --frozen-lockfile
      - name: Construction
        run: pnpm build
      - name: Empreintes du texte et des métadonnées Tanzil
        run: sha256sum infra/ci/contenu/coran/*
      - name: Tests (dont base PostgreSQL et batterie du tuteur)
        run: pnpm -r --no-bail --workspace-concurrency=1 test
      - name: Rapport de la batterie adverse (fournisseur simulé)
        run: node packages/tutor/dist/cli/eval.js --fournisseur simule --sortie tuteur-batterie.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: batterie-tuteur
          path: tuteur-batterie.*

  android-debug:
    # APK de DÉBOGAGE (emballage Capacitor de la PWA) : SDK Android de l'image GitHub (licences déjà acceptées
    # par l'image), JDK 21, aucune clé ni compte Google ; l'APK est publié en artefact de la CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: pnpm (corepack)
        run: corepack enable && pnpm --version
      - name: Plateforme et outils Android épinglés
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: APK de débogage (reproductible)
        run: infra/android/build-debug.sh
        env:
          AWFORM_ANDROID_URL: https://demo.awform.invalid
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: awform-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
