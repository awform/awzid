# AWFORM — production et démonstration (Docker Compose).
# Services : Caddy (entrée HTTP/HTTPS), web (SvelteKit), api (Fastify), worker (pg-boss), db (PostgreSQL 18).
# Secrets : UNIQUEMENT dans le fichier d'environnement de l'hôte (AWFORM_ENV_FILE, droits 600, hors dépôt),
# écrit par infra/prod/deploy.sh. Redémarrage automatique (Docker est lancé au démarrage de la machine).
name: awform

x-logs: &logs
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # moindre privilège : la base ne reçoit QUE son mot de passe (db.env, écrit par deploy.sh)
    env_file: '${AWFORM_DB_ENV_FILE:?AWFORM_DB_ENV_FILE absent}'
    environment:
      POSTGRES_USER: awform
      POSTGRES_DB: awform
      TZ: Europe/Paris
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U awform -d awform']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logs
    # aucun port publié : la base n'est joignable que par les conteneurs

  migrate:
    image: awform/api:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: api }
    env_file: '${AWFORM_ENV_FILE:?AWFORM_ENV_FILE absent}'
    command: ['node', 'node_modules/@awform/db/dist/cli/migrate.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  import:
    # import d'une édition de contenu (copie des livres en lecture seule) : `--edition <code> --publish`
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_FILE}'
    environment: { AWFORM_CONTENT_DIR: /content }
    volumes: ['${AWFORM_CONTENT_DIR:-~/awform-content}:/content:ro']
    entrypoint: ['node', 'node_modules/@awform/db/dist/cli/import.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  api:
    image: awform/api:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: api }
    restart: unless-stopped
    env_file: '${AWFORM_ENV_FILE}'
    environment: { TRUST_PROXY: '1' }
    depends_on: { db: { condition: service_healthy } }
    logging: *logs

  worker:
    image: awform/worker:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: worker }
    restart: unless-stopped
    env_file: '${AWFORM_ENV_FILE}'
    depends_on: { db: { condition: service_healthy } }
    logging: *logs

  web:
    image: awform/web:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: web }
    restart: unless-stopped
    environment: { API_URL: 'http://api:3000' }
    depends_on: [api]
    logging: *logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # moindre privilège : Caddy ne reçoit QUE les adresses du site (caddy.env, aucun secret)
    env_file: '${AWFORM_CADDY_ENV_FILE:?AWFORM_CADDY_ENV_FILE absent}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    logging: *logs

volumes:
  db:
  caddy_data:
  caddy_config:
