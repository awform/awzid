# AWFORM — production et démonstration (Docker Compose).
# Services : Caddy (entrée HTTP/HTTPS), web (SvelteKit), api (Fastify), worker (pg-boss), db (PostgreSQL 18).
# Secrets : UNIQUEMENT dans ~/.config/awform/prod.env (droits 600, hors dépôt), écrit par deploy.sh, et JAMAIS
# monté tel quel : chaque service reçoit son fichier <service>.env (AWFORM_ENV_DIR), découpé par env-split.sh
# selon env-scopes.conf (moindre privilège, vérifié par un test et par env-check.sh). Redémarrage automatique (Docker est lancé au démarrage de la machine).
name: awform

x-logs: &logs
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # moindre privilège : la base ne reçoit QUE son mot de passe
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/db.env'
    environment:
      POSTGRES_USER: awform
      POSTGRES_DB: awform
      TZ: Europe/Paris
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U awform -d awform']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logs
    # aucun port publié : la base n'est joignable que par les conteneurs

  migrate:
    image: awform/api:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: api }
    # outils (migration, import) : la base seulement
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    command: ['node', 'node_modules/@awform/db/dist/cli/migrate.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  import:
    # import d'une édition de contenu (copie des livres en lecture seule) : `--edition <code> --publish`
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    environment: { AWFORM_CONTENT_DIR: /content }
    volumes: ['${AWFORM_CONTENT_DIR:-~/awform-content}:/content:ro']
    entrypoint: ['node', 'node_modules/@awform/db/dist/cli/import.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  roles:
    # comptes PostgreSQL de l'API et du travailleur, droits minimaux table par table (lot 14)
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    entrypoint: ['node', 'node_modules/@awform/db/dist/cli/roles.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  demo:
    # données FICTIVES de démonstration (deploy.sh --demo) : compte propriétaire, jamais l'API
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    entrypoint: ['node', 'dist/cli/demo.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  staff:
    # comptes du personnel et rôles (lot F1) : `--kind enseignant|admin --email …` (mot de passe passé par
    # `run -e AWFORM_STAFF_PASSWORD`, jamais en argument) ou `--role referent --email … [--retirer]`
    # (référent religieux : file des signalements du contenu) ; compte propriétaire, jamais l'API
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    entrypoint: ['node', 'dist/cli/staff.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  relais:
    # relais d'école (lot 17) : creer <nom> <sous-domaine> | revoquer <sous-domaine> | liste
    # (compte propriétaire : l'API n'a que lecture et mise à jour du battement sur la table relay)
    image: awform/api:${AWFORM_VERSION:-local}
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    entrypoint: ['node', 'dist/cli/relais.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  coran-audio:
    # audio du Coran (lot 27) : catalogue | verifier | importer | activer | retirer | etat
    # compte propriétaire ; fichiers reçus du Complexe (zip « ayat » décompressé) en lecture seule dans
    # /source ; stockage servi par l'API dans le volume « audio » ; ffmpeg pour le contrôle des silences
    image: awform/outils-audio:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: outils-audio }
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    environment: { AWFORM_AUDIO_DIR: /audio }
    volumes: ['audio:/audio', '${AWFORM_AUDIO_SOURCE:-~/coran-audio-source}:/source:ro']
    entrypoint: ['node', 'node_modules/@awform/db/dist/cli/coran-audio.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  lecons-audio:
    # audio des leçons (A3) : importer | etat — fichiers de synthèse vocale des livres (index.js + <sha1>.mp3,
    # produits par audio/gen-audio.ps1) en lecture seule dans /source ; import idempotent avec contrôle
    # (fichier présent, durée non nulle) et garde coranique ; stockage « audio_lecons » servi par l'API
    image: awform/outils-audio:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: outils-audio }
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/outils.env'
    environment: { AWFORM_LECONS_AUDIO_DIR: /lecons-audio }
    volumes:
      ['audio_lecons:/lecons-audio', '${AWFORM_LECONS_AUDIO_SOURCE:-~/lecons-audio}:/source:ro']
    entrypoint: ['node', 'node_modules/@awform/db/dist/cli/lecons-audio.js']
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    profiles: [outils]
    logging: *logs

  api:
    image: awform/api:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: api }
    restart: unless-stopped
    # base, clé de session, tuteur, paiements ; jamais POSTGRES_PASSWORD seul
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/api.env'
    environment:
      {
        TRUST_PROXY: '1',
        AWFORM_RELAIS_CERTS: /relais-certs,
        AWFORM_AUDIO_DIR: /audio,
        AWFORM_LECONS_AUDIO_DIR: /lecons-audio,
      }
    # certificats des SEULS relais d'école (copiés par certsrelais), jamais le stockage de Caddy ;
    # audio du Coran (lot 27) et audio des leçons (A3) en lecture seule
    volumes: ['relais_certs:/relais-certs:ro', 'audio:/audio:ro', 'audio_lecons:/lecons-audio:ro']
    depends_on: { db: { condition: service_healthy } }
    logging: *logs

  worker:
    image: awform/worker:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: worker }
    restart: unless-stopped
    # la base seulement (ni clé de session, ni clés du tuteur ou des paiements)
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/worker.env'
    depends_on: { db: { condition: service_healthy } }
    logging: *logs

  web:
    image: awform/web:${AWFORM_VERSION:-local}
    build: { context: ../.., dockerfile: infra/prod/Dockerfile, target: web }
    restart: unless-stopped
    environment: { API_URL: 'http://api:3000' }
    depends_on: [api]
    logging: *logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # moindre privilège : Caddy ne reçoit QUE les adresses du site (aucun secret)
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/caddy.env'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    logging: *logs

  certsrelais:
    # relais d'école (lot 17) : copie les certificats des sous-domaines de relais (*.RELAIS_DOMAINE) pour
    # l'API ; lit le stockage de Caddy en lecture seule ; reçoit seulement les adresses (caddy.env)
    image: alpine:3
    restart: unless-stopped
    env_file: '${AWFORM_ENV_DIR:?AWFORM_ENV_DIR absent}/caddy.env'
    volumes:
      - caddy_data:/data:ro
      - relais_certs:/out
      - ./relais-certs.sh:/relais-certs.sh:ro
    entrypoint: ['sh', '/relais-certs.sh']
    depends_on: [caddy]
    logging: *logs

volumes:
  db:
  caddy_data:
  caddy_config:
  relais_certs:
  audio:
  audio_lecons:
