# AWFORM — ce que chaque service reçoit de prod.env (moindre privilège).
# prod.env (~/.config/awform, droits 600) est la SOURCE UNIQUE des secrets et n'est monté dans AUCUN
# conteneur : infra/prod/env-split.sh en tire un fichier par service (<service>.env, droits 600).
# Vérifié par apps/api/test/env-scopes.test.ts (code ↔ périmètres ↔ compose.yml) et, sur la machine,
# par infra/prod/env-check.sh (environnement réel des conteneurs).
# Format : « service: VAR VAR … » (noms exacts, pas de motif).
api: DATABASE_URL AWFORM_SECRET_KEY COOKIE_SECURE TZ AWFORM_SIGNUP_PER_HOUR AWFORM_EDITION_FORCE AWFORM_TUTEUR AWFORM_TUTEUR_BATTERIE AWFORM_TUTEUR_MODELE_ADULTE AWFORM_TUTEUR_MODELE_ENFANT ANTHROPIC_API_KEY AWFORM_PAIEMENT AWFORM_PAIEMENT_SIM_SECRET AWFORM_DROITS STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
worker: DATABASE_URL TZ
outils: DATABASE_URL TZ
db: POSTGRES_PASSWORD
caddy: SITE SITE_LAN DEFAULT_SNI
