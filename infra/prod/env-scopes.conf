# AWFORM — ce que chaque service reçoit de prod.env (moindre privilège).
# prod.env (~/.config/awform, droits 600) est la SOURCE UNIQUE des secrets et n'est monté dans AUCUN
# conteneur : infra/prod/env-split.sh en tire un fichier par service (<service>.env, droits 600).
# Vérifié par apps/api/test/env-scopes.test.ts (code ↔ périmètres ↔ compose.yml) et, sur la machine,
# par infra/prod/env-check.sh (environnement réel des conteneurs).
# Comptes PostgreSQL : outils = propriétaire (migrations, import, rôles, démonstration) ; api et worker = comptes
# à droits minimaux (packages/db/src/roles.ts).
# A2 : QF_CLIENT_ID, QF_CLIENT_SECRET, QF_ENV (prelive | production) : audio en ligne de Quran Foundation, lu
# par l'API seulement (jeton côté serveur) ; absents → récitateurs en ligne non proposés, sans erreur.
# 19/10/2026 : tuteur de conversation — AWFORM_VERTEX_* (projet, lieu de l'UE, compte de service EMPRUNTÉ par la VM : aucune clé),
# AWFORM_TUTEUR_VERTEX_* (modèle, réflexion, empreinte de l'invite validée), AWFORM_TUTEUR_PLAFOND_* et suivants (plafonds en euros,
# changement daté, alertes, minutes et échanges par élève), AWFORM_TUTEUR_VOIX ; aucun secret (TUTEUR_IA.md § 10).
# 18/10/2026 : identités — AWFORM_GOOGLE_* (« Continuer avec Google », secret client lu par l'API seule), AWFORM_TELEPHONE_*
# et AWFORM_WHATSAPP_* (numéro WhatsApp : webhook signé de Meta, envoi payant de secours) ; tous éteints par défaut.
# Format : « service: VAR VAR … » (noms exacts, pas de motif) ; « VAR=SOURCE » : le service reçoit VAR avec la valeur
# de SOURCE (ex. chaque service a SON compte PostgreSQL, lot 14).
