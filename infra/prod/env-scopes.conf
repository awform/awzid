# AWFORM — ce que chaque service reçoit de prod.env (moindre privilège).
# prod.env (~/.config/awform, droits 600) est la SOURCE UNIQUE des secrets et n'est monté dans AUCUN
# conteneur : infra/prod/env-split.sh en tire un fichier par service (<service>.env, droits 600).
# Vérifié par apps/api/test/env-scopes.test.ts (code ↔ périmètres ↔ compose.yml) et, sur la machine,
# par infra/prod/env-check.sh (environnement réel des conteneurs).
# Comptes PostgreSQL : outils = propriétaire (migrations, import, rôles, démonstration) ; api et worker = comptes
# à droits minimaux (packages/db/src/roles.ts).
# Format : « service: VAR VAR … » (noms exacts, pas de motif) ; « VAR=SOURCE » : le service reçoit VAR avec la valeur`n# de SOURCE (ex. chaque service a SON compte PostgreSQL, lot 14).
api: DATABASE_URL=DATABASE_URL_API AWFORM_SECRET_KEY COOKIE_SECURE TZ AWFORM_SIGNUP_PER_HOUR AWFORM_EDITION_FORCE AWFORM_TUTEUR AWFORM_TUTEUR_BATTERIE AWFORM_TUTEUR_MODELE_ADULTE AWFORM_TUTEUR_MODELE_ENFANT ANTHROPIC_API_KEY AWFORM_PAIEMENT AWFORM_PAIEMENT_SIM_SECRET AWFORM_DROITS STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET AWFORM_LANGUES_PREPARATION
worker: DATABASE_URL=DATABASE_URL_WORKER TZ
outils: DATABASE_URL TZ AWFORM_DB_API_PASSWORD AWFORM_DB_WORKER_PASSWORD
db: POSTGRES_PASSWORD
caddy: SITE SITE_LAN DEFAULT_SNI
